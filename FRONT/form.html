<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo/Editar Livro</title>
</head>

<body>
    <h1 id="titulo-pagina">Novo Livro</h1>

    <input type="text" id="titulo" placeholder="Título do Livro"><br><br>
    <input type="text" id="autor" placeholder="Nome do Autor"><br><br>
    
    <button onclick="salvarLivro()">Salvar no Banco</button>
    <br><br>
    <a href="index.html">Voltar para Lista</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idEdicao = urlParams.get('id');

        if (idEdicao) {
            document.getElementById('titulo-pagina').innerText = "Editar Livro (ID: " + idEdicao + ")";
            carregarLivroParaEditar(idEdicao);
        }

        async function carregarLivroParaEditar(id) {
            const resposta = await fetch('http://localhost:8000/api/livros/' + id);
            const livro = await resposta.json();
            
            document.getElementById('titulo').value = livro.titulo;
            document.getElementById('autor').value = livro.autor;
        }

        async function salvarLivro() {
            const nomeDigitado = document.getElementById('titulo').value;
            const autorDigitado = document.getElementById('autor').value;

            const urlDaApi = idEdicao 
                ? 'http://localhost:8000/api/livros/' + idEdicao
                : 'http://localhost:8000/api/livros';

            const verboHTTP = idEdicao ? 'PUT' : 'POST';

            const resposta = await fetch(urlDaApi, {
                method: verboHTTP,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    titulo: nomeDigitado,
                    autor: autorDigitado
                })
            });

            if (resposta.status === 201 || resposta.status === 200) {
                alert('Salvo com sucesso!');
                window.location.href = 'index.html';
            } else {
                alert('Erro na API ao salvar (Status: ' + resposta.status + ').');
            }
        }
    </script>
</body>

</html>
